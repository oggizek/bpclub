<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5ed">
  <meta name="description" content="BP Club SP1 — zine boss makeupcelle i foidy w sp1">
  <title>BP Club SP1 — Dobrze być razem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #17211e;
      --paper: #f3f5ed;
      --green: #c2f164;
      --coral: #ef7658;
      --line: rgba(23, 33, 30, .18);
      --display: "Space Grotesk", "Trebuchet MS", sans-serif;
      --body: "DM Sans", "Trebuchet MS", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .topbar {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      padding: 26px 5.5vw;
      color: white;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: inherit;
      font: 700 18px/1 var(--display);
      text-decoration: none;
    }
    .wordmark-mark {
      display: grid;
      width: 34px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 50%;
      color: var(--ink);
      background: var(--green);
      font-size: 15px;
    }
    .nav { display: flex; align-items: center; gap: clamp(18px, 3vw, 42px); }
    .nav a {
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    .nav a:hover { color: var(--green); }
    .hero {
      position: relative;
      display: flex;
      min-height: min(790px, 94svh);
      align-items: flex-end;
      overflow: hidden;
      padding: 150px 9vw 76px;
      color: white;
      background-color: #293a32;
      isolation: isolate;
    }
    .hero::after {
      position: absolute;
      z-index: -1;
      background: linear-gradient(90deg, rgba(12, 23, 19, .72), rgba(12, 23, 19, .04) 88%), linear-gradient(0deg, rgba(12, 23, 19, .5), transparent 65%);
      content: "";
      inset: 0;
    }
    .hero-image {
      position: absolute;
      z-index: -2;
      width: 100%;
      height: 100%;
      inset: 0;
      object-fit: cover;
      object-position: center 48%;
    }
    .hero--empty {
      background-color: #293a32;
      background-image: repeating-linear-gradient(135deg, rgba(194, 241, 100, .08) 0 1px, transparent 1px 24px);
    }
    .hero--empty .hero-image { display: none; }
    .hero--empty::after { background: linear-gradient(90deg, rgba(12, 23, 19, .38), rgba(12, 23, 19, .03)); }
    .photo-note {
      position: absolute;
      top: 50%;
      left: 50%;
      display: none;
      width: min(82%, 460px);
      padding: 32px;
      border: 1px solid rgba(255,255,255,.3);
      color: rgba(255,255,255,.76);
      font-size: 13px;
      text-align: center;
      transform: translate(-50%, -50%);
    }
    .hero--empty .photo-note { display: block; }
    .photo-note strong {
      display: block;
      margin-bottom: 8px;
      color: var(--green);
      font: 600 18px var(--display);
    }
    .hero-content { width: min(900px, 100%); }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before { width: 27px; height: 2px; background: var(--green); content: ""; }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      max-width: 850px;
      margin-bottom: 22px;
      font: 600 clamp(64px, 11vw, 150px)/.88 var(--display);
    }
    h1 span { color: var(--green); }
    .hero-bottom { display: flex; align-items: end; justify-content: space-between; gap: 30px; }
    .hero-copy { max-width: 420px; margin: 0; font-size: 16px; line-height: 1.65; }
    .round-link {
      display: grid;
      flex: 0 0 58px;
      width: 58px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 50%;
      color: white;
      font-size: 23px;
      text-decoration: none;
      transition: color .2s, background .2s, transform .2s;
    }
    .round-link:hover { color: var(--ink); background: var(--green); transform: translateY(3px); }
    .ticker {
      overflow: hidden;
      padding: 17px 0;
      color: var(--ink);
      background: var(--green);
      font: 600 14px var(--display);
      text-transform: uppercase;
    }
    .ticker-track { display: flex; width: max-content; gap: 30px; animation: drift 28s linear infinite; }
    .ticker-item { display: flex; align-items: center; gap: 30px; white-space: nowrap; }
    .ticker-item::after { color: var(--coral); content: "✳"; font-size: 18px; }
    @keyframes drift { to { transform: translateX(-50%); } }
    .section { padding: 110px 9vw; }
    .intro {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 8vw;
      align-items: start;
    }
    .section-label { margin: 8px 0 0; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .section-label span { display: inline-block; width: 8px; height: 8px; margin-right: 9px; border-radius: 50%; background: var(--coral); }
    .intro h2, .activities h2, .join h2 {
      margin-bottom: 25px;
      font: 600 clamp(40px, 6vw, 78px)/.98 var(--display);
    }
    .intro h2 em { color: #53814c; font-style: normal; }
    .intro-copy { max-width: 650px; }
    .intro-copy p { font-size: 17px; line-height: 1.8; }
    .intro-copy .lead { font-size: 21px; line-height: 1.55; }
    .values {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 48px;
      border-top: 1px solid var(--line);
    }
    .value { padding: 18px 15px 0 0; }
    .value strong { display: block; margin-bottom: 7px; font: 600 18px var(--display); }
    .value span { color: #59615b; font-size: 13px; }
    .activities { color: white; background: var(--ink); }
    .activities-head { display: flex; align-items: end; justify-content: space-between; gap: 35px; margin-bottom: 55px; }
    .activities h2 { max-width: 600px; margin-bottom: 0; }
    .activities-head p { max-width: 280px; margin: 0 0 5px; color: #c5cdc5; font-size: 14px; line-height: 1.7; }
    .activity-list { border-top: 1px solid rgba(255,255,255,.25); }
    .activity {
      display: grid;
      grid-template-columns: 65px 1fr auto;
      align-items: center;
      gap: 24px;
      padding: 24px 0;
      border-bottom: 1px solid rgba(255,255,255,.25);
    }
    .activity-number { color: var(--green); font: 600 14px var(--display); }
    .activity h3 { margin: 0; font: 500 clamp(21px, 3vw, 33px) var(--display); }
    .activity p { margin: 7px 0 0; color: #c5cdc5; font-size: 13px; }
    .activity-arrow { color: var(--green); font-size: 25px; }
    .join {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 36px;
      overflow: hidden;
      background: var(--coral);
    }
    .join .section-label { margin-bottom: 28px; }
    .join h2 { max-width: 760px; margin-bottom: 0; }
    .join-copy { max-width: 320px; margin: 0; font-size: 15px; line-height: 1.7; }
    .join-link {
      display: inline-flex;
      align-items: center;
      gap: 20px;
      margin-top: 22px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--ink);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 9vw; font-size: 12px; }
    .footer p { margin: 0; }
    .footer a { font-weight: 700; text-decoration: none; }
    @media (max-width: 700px) {
      .topbar { padding: 19px 6vw; }
      .nav { gap: 15px; }
      .nav a { font-size: 11px; }
      .nav a:first-child { display: none; }
      .hero { min-height: 740px; min-height: 88svh; padding: 130px 7vw 44px; }
      h1 { font-size: clamp(62px, 17vw, 112px); }
      .hero-copy { max-width: 310px; font-size: 14px; }
      .section { padding: 76px 7vw; }
      .intro { grid-template-columns: 1fr; gap: 32px; }
      .intro-copy .lead { font-size: 19px; }
      .values { gap: 15px; }
      .value { padding-right: 0; }
      .value strong { font-size: 15px; }
      .value span { font-size: 11px; line-height: 1.5; }
      .activities-head { display: block; margin-bottom: 38px; }
      .activities-head p { margin-top: 20px; }
      .activity { grid-template-columns: 34px 1fr auto; gap: 12px; padding: 21px 0; }
      .activity p { max-width: 250px; line-height: 1.5; }
      .join { grid-template-columns: 1fr; gap: 25px; }
      .join-copy { max-width: 460px; }
      .footer { padding: 22px 7vw; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    /* Celowo krzykliwy, niechlujny wyglad strony. */
    body {
      color: #ff00b7;
      background: #c8ff00;
      font-family: "Comic Sans MS", cursive;
    }
    .topbar { display: none; }
    .hero {
      display: flex;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      padding: 0 12px 30px;
      color: #ff00b7;
      background: #ffff00;
      text-align: center;
    }
    .hero::after { display: none; }
    .hero-image {
      position: static;
      display: block;
      width: min(100%, 1100px);
      height: 65vh;
      margin: 0 auto 20px;
      object-fit: fill;
    }
    .hero--empty .hero-image { display: none; }
    .hero--empty { min-height: 65vh; justify-content: center; }
    .hero--empty .photo-note {
      position: static;
      display: block;
      border: 5px dotted #ff00b7;
      color: #ff00b7;
      transform: none;
    }
    .allegro-link {
      display: inline-block;
      margin: 0 auto 12px;
      padding: 12px 30px;
      border: 5px dashed #00ffff;
      color: #ffff00;
      background: #ff00b7;
      box-shadow: 7px 7px #0000ff;
      font: 700 28px "Comic Sans MS", cursive;
      text-decoration: none;
      transform: rotate(3deg);
    }
    .hero-content { width: 100%; }
    .eyebrow, .hero-bottom { display: none; }
    h1 {
      max-width: none;
      margin: 8px 0 20px;
      color: #ff0000;
      font: 700 clamp(34px, 8vw, 82px)/1.1 "Comic Sans MS", cursive;
      text-shadow: 5px 5px #00ffff;
      transform: rotate(-2deg);
    }
    h1 span { color: #ff0000; }
    .ticker { background: #ff00b7; color: #ffff00; }
    .section { padding: 60px 9vw; }
    .intro, .activities, .join { background: #00ffff; color: #ff00b7; }
    .activities-head p, .activity p { color: #ff0000; }
    .activity-list, .activity { border-color: #ff00b7; }
    .activity-number, .activity-arrow { color: #ff0000; }
    .join { background: #ff6600; color: #0000ff; }
    .footer { background: #ff00b7; color: #ffff00; }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#start" aria-label="BP Club SP1, strona główna">
      <span class="wordmark-mark">B</span> BP CLUB <span aria-hidden="true">/</span> SP1
    </a>
    <nav class="nav" aria-label="Nawigacja główna">
      <a href="#o-klubie">O klubie</a>
      <a href="#co-robimy">Co robimy</a>
      <a href="#dolacz">Dołącz</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="start" aria-labelledby="hero-title">
      <img class="hero-image" src="images/bp-club.jpg" alt="Uczniowie BP Club SP1 podczas wspólnego spotkania" fetchpriority="high">
      <div class="photo-note" aria-hidden="true">
        <strong>TU DODAJ SWOJE ZDJfCIE</strong>
        Wstaw plik <code>bp-club.jpg</code> do folderu <code>images</code>.
      </div>
      <a class="allegro-link" href="https://allegro.pl/produkt/mlotek-ciesielski-vergionic-25-cm-z-antypoposlizgowym-uchwytem-00ad26f9-3bfc-45d0-b4f5-4ca182513652?offerId=15910513674&amp;utm_feed=aa34192d-eee2-4419-9a9a-de66b9dfae24&amp;ev_adgr=_dio_narzedzia&amp;ev_campaign_id=22376334369" target="_blank" rel="noopener noreferrer">MŁOTEK</a>
      <div class="hero-content">
        <p class="eyebrow">Szkolna ekipa · SP1</p>
        <h1 id="hero-title">Najlepszy klub w SP1<br>jebać foidy</h1>
        <div class="hero-bottom">
          <p class="hero-copy">BP Club to miejsce na dobre pomysły, wspólne akcje i ludzi, z którymi szkoła nabiera kolorów.</p>
          <a class="round-link" href="#o-klubie" aria-label="Przewiń do informacji o klubie">↓</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    const heroImage = document.querySelector('.hero-image');
    heroImage.addEventListener('error', () => heroImage.parentElement.classList.add('hero--empty'));
  </script>
</body>
</html>
